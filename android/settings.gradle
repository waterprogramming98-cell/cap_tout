pluginManagement {
    buildscript {
        repositories {
            mavenCentral()
        }
        dependencies {
            classpath("com.google.code.gson:gson:2.10.1")
        }
    }
    repositories {
        maven { url "$rootDir/../local-maven" }
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}

plugins {
    id("com.facebook.react.settings") version "0.81.4"
}

// Generate autolinking.json from autolinking_manual.json before RNGP reads it
def autolinkingManualFile = new File(rootDir, "autolinking_manual.json")
def autolinkingOutputDir = new File(rootDir, "build/generated/autolinking")
def autolinkingOutputFile = new File(autolinkingOutputDir, "autolinking.json")
if (autolinkingManualFile.exists() && !autolinkingOutputFile.exists()) {
    autolinkingOutputDir.mkdirs()
    def nodeModulesPath = new File(rootDir, "../node_modules").canonicalPath
    def content = autolinkingManualFile.text
        .replace("__NODE_MODULES__", nodeModulesPath)
        .replace("__ANDROID_SOURCE_DIR__", rootDir.canonicalPath)
    autolinkingOutputFile.text = content
    println "Generated autolinking.json from autolinking_manual.json"
}

rootProject.name = "ToutRoutesApp"
include(":app")

def includeProject(name, path) {
    include(":${name}")
    project(":${name}").projectDir = new File(path)
}

