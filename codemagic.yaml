workflows:
  ios-release:
    name: CapTout iOS Release
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: CapTout

    environment:
      xcode: latest
      cocoapods: default

      ios_signing:
        provisioning_profiles:
          - Tout
        certificates:
          - Tout

      vars:
        BUNDLE_ID: 'com.toutsroutes.capout'
        XCODE_PROJECT: 'ios/ToutRoutesApp.xcodeproj'
        XCODE_SCHEME: 'ToutRoutesApp'

    scripts:
      - name: Install CocoaPods
        script: |
          cd ios
          pod install --repo-update

      - name: Set up iOS code signing
        script: |
          xcode-project use-profiles

      - name: Increment build number
        script: |
          cd $CM_BUILD_DIR
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$BUNDLE_ID" || echo 0)
          agvtool new-version -all $(($LATEST_BUILD_NUMBER + 1))

      - name: Build iOS IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
