workflows:
  ios-release:
    name: CapTout iOS Release
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic CapTout

    environment:
      xcode: latest
      cocoapods: default
      node: 22

      ios_signing:
        provisioning_profiles:
          - ToutRoutesApp_APP_STORE
        certificates:
          - ToutRoutesApp Apple Distribution

      vars:
        BUNDLE_ID: 'com.toutsroutes.cap-tout'
        XCODE_PROJECT: 'ios/ToutRoutesApp.xcodeproj'
        XCODE_SCHEME: 'ToutRoutesApp'

    scripts:

      - name: Install npm dependencies
        script: |
          npm ci

      - name: Build web application
        script: |
          npm run build

      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios

      - name: Set up iOS code signing
        script: |
          xcode-project use-profiles

      - name: Build iOS IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
