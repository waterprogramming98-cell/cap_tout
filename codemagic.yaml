# codemagic.yaml — CapTout (Captain App) iOS Build Configuration
# https://docs.codemagic.io/yaml-quick-start/
#
# REQUIRED ENVIRONMENT VARIABLES (set in Codemagic UI → App Settings → Environment variables):
#   APP_STORE_CONNECT_KEY_IDENTIFIER  — Your App Store Connect API Key ID (e.g. ABC123DEF4)
#   APP_STORE_CONNECT_ISSUER_ID       — Your App Store Connect Issuer ID (UUID format)
#   APP_STORE_CONNECT_PRIVATE_KEY     — Contents of your .p8 API key file (paste full text)
#   CERTIFICATE_PRIVATE_KEY           — Contents of your iOS Distribution certificate .p12 private key
#   BUNDLE_ID                         — com.toutsroutes.captout  (must match Apple Developer Portal)
#   APPLE_TEAM_ID                     — Your 10-character Apple Team ID (e.g. A1B2C3D4E5)
#   GOOGLE_MAPS_API_KEY               — Your Google Maps iOS API key
#   FIREBASE_IOS_CONFIG               — Contents of GoogleService-Info.plist for com.captoutapp

workflows:
  ios-release:
    name: CapTout iOS Release
    max_build_duration: 90
    instance_type: mac_mini_m2

    environment:
      groups:
        - firebase_credentials
      ios_signing:
        distribution_type: app_store
        bundle_identifier: $BUNDLE_ID
      vars:
        XCODE_PROJECT: "ios/ToutRoutesApp.xcodeproj"
        XCODE_SCHEME: "ToutRoutesApp"
        BUNDLE_ID: "com.captoutapp"
      node: 20.0.0
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install npm dependencies
        script: |
          npm install --legacy-peer-deps

      - name: Install CocoaPods
        script: |
          cd ios && pod install --repo-update

      - name: Set Google Maps API Key
        script: |
          /usr/libexec/PlistBuddy -c "Set :GMSApiKey $GOOGLE_MAPS_API_KEY" ios/ToutRoutesApp/Info.plist || \
          /usr/libexec/PlistBuddy -c "Add :GMSApiKey string $GOOGLE_MAPS_API_KEY" ios/ToutRoutesApp/Info.plist

      - name: Install Firebase iOS configuration
        script: |
          if [ -z "$FIREBASE_IOS_CONFIG" ]; then
            echo "FIREBASE_IOS_CONFIG is required for an App Store build."
            exit 1
          fi
          printf '%s' "$FIREBASE_IOS_CONFIG" > ios/GoogleService-Info.plist
          test -s ios/GoogleService-Info.plist

      - name: Set bundle version from build number
        script: |
          LATEST=$(app-store-connect get-latest-build-number "$BUNDLE_ID" 2>/dev/null || echo "0")
          agvtool new-version -all $((LATEST + 1))

      - name: Build iOS release IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --config Release

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    # IPA is intentionally retained as an artifact for device testing before App Store submission.
    # App Store Connect publishing will be enabled only after the release is tested on a physical iPhone.
