workflows:
  ios-release:
    name: CapTout iOS Release

    max_build_duration: 90
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic K-Waiter

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.toutsroutes.captout

      vars:
        BUNDLE_ID: "com.toutsroutes.captout"
        XCODE_PROJECT: "ios/ToutRoutesApp.xcodeproj"
        XCODE_SCHEME: "ToutRoutesApp"

      node: 20.0.0
      xcode: latest
      cocoapods: default

    scripts:

      - name: Install npm dependencies
        script: |
          npm install --legacy-peer-deps

      - name: Install CocoaPods
        script: |
          cd ios
          rm -rf Pods
          rm -f Podfile.lock
          pod deintegrate || true
          pod install --repo-update

      - name: Set Google Maps API Key
        script: |
          /usr/libexec/PlistBuddy \
            -c "Set :GMSApiKey AIzaSyC09p4-3IhSac_zt_2C_fd-ML8kFaRAXes" \
            ios/ToutRoutesApp/Info.plist || \
          /usr/libexec/PlistBuddy \
            -c "Add :GMSApiKey string AIzaSyC09p4-3IhSac_zt_2C_fd-ML8kFaRAXes" \
            ios/ToutRoutesApp/Info.plist

      - name: Set up iOS code signing
        script: |
          xcode-project use-profiles

      - name: Build iOS release IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --config Release

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers
        submit_to_app_store: false
