workflows:
  ios-release:
    name: CapTout iOS Release
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic CapTout

    environment:
      xcode: latest
      cocoapods: default
      node: 20

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.toutsroutes.captout

      vars:
        BUNDLE_ID: com.toutsroutes.captout
        XCODE_PROJECT: ios/ToutRoutesApp.xcodeproj
        XCODE_SCHEME: ToutRoutesApp

    scripts:
      - name: Install npm dependencies
        script: |
          npm install --legacy-peer-deps

      - name: Install CocoaPods
        script: |
          cd ios
          pod install --repo-update

      - name: Set build number
        script: |
          LATEST=$(app-store-connect get-latest-build-number "$BUNDLE_ID" 2>/dev/null || echo "0")
          agvtool new-version -all $((LATEST + 1))

      - name: Build iOS IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - ios/ToutRoutesApp/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
