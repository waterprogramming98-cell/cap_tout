workflows:
  capTout-ios-release:
    name: CapTout iOS Release

    integrations:
      app_store_connect: Codemagic CapTout

    environment:
      flutter: stable

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.toutsroutes.captout

    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Build iOS
        script: |
          flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
